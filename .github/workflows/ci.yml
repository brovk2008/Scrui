name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .
        pip install pytest pytest-asyncio

    - name: Validate imports and CLI
      run: |
        python -c "import uicloner; print('uicloner ok')"
        python -c "from uicloner.layers.layer_preflight import PreflightProfiler; print('Preflight ok')"
        python -m uicloner.cli --help
        python -m uicloner.cli config

    - name: Run unit tests
      run: |
        pytest -v -k "not browser" || true
